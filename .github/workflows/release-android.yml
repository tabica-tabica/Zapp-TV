name: Release Android TV

# APK do app Android TV (android/: WebView com o bundle de TV). Tag v* anexa
# o APK no release da tag; rodar à mão gera só o artefato pra baixar.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bundle de TV (alvo android) → android/app/src/main/assets/www
      - run: npm run build:android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O Android SDK já vem no runner (ANDROID_HOME); o Gradle sai daqui
      # (o repositório não leva o wrapper)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Chave de release fixa (secrets): atualizar o app instalado exige a
      # MESMA assinatura — com a chave de debug de cada runner, toda versão
      # nova pediria desinstalar (e perder o login)
      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_B64: APK assinado com a chave de debug"
          fi

      - name: APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Nome do arquivo
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          mkdir -p saida
          cp android/app/build/outputs/apk/release/app-release.apk "saida/Zapp.TV_${VERSAO}_android-tv.apk"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: zapp-tv-android
          path: saida/*.apk

      - name: Anexar no release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Zapp TV ${{ github.ref_name }}
          files: saida/*.apk
